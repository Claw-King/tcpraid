# One tcpraid node in a container.
#
# The same file works where a platform takes Docker Compose YAML: TrueNAS (Apps >
# Discover Apps > Install via YAML), Synology Container Manager (Project), QNAP
# Container Station (Applications > Create), or plain "docker compose up -d".
#
# Before the first start, look at four things below: the image, the data directory,
# the password of the web interface, and the ports for forwarding rules.
services:
  tcpraid:
    image: ghcr.io/claw-king/tcpraid:0.9.0
    container_name: tcpraid
    # A new node takes its name from the host name at its first start and adds four
    # random characters, for example tcpraid-k3x9, so two nodes made from this file
    # do not get the same name. For a name you recognise, set the host name here (for
    # example nas-a and nas-b) before the first start, or rename the node in the web
    # interface (Settings) before you pair it: the other node keeps the name this
    # one had when the two were paired.
    hostname: tcpraid
    restart: unless-stopped
    environment:
      # Password of the web interface. Left empty, the node makes one at its first
      # start and prints it once in its log ("docker logs tcpraid").
      TCPRAID_UI_PASSWORD: ""
    volumes:
      # The node's identity key, its peers and its rules live here: keep it, back it up
      # like a private key, and do not share it between two nodes. On a NAS, put an
      # absolute path of a dataset or shared folder on the left, for example
      # /mnt/tank/apps/tcpraid:/data
      - ./data:/data
    ports:
      # Web interface and local API (plain HTTP: publish it on a network you trust).
      - "9850:9850"
      # Other nodes connect here. The node that is reachable from the other one needs
      # this port open to it.
      - "9851:9851"
      # Forwarding rules listen on these ports. A rule made in the web interface must
      # use a port from this range, with the listen address 0.0.0.0. To change the
      # range, change both sides of the mapping to the same ports.
      - "50000-50010:50000-50010"
      # UDP feedback from the other node (optional, off by default). To use it,
      # uncomment the next line and the "command:" line marked "UDP feedback" below,
      # then tell the other node where to send it:
      #   tcpraid peers set NAME -udp-dial THIS-HOST:8446
      # - "8446:8446/udp"
    # UDP feedback: the image's own command line with -udp-listen added.
    # command: ["run", "-data", "/data", "-api", "0.0.0.0:9850", "-listen", "0.0.0.0:9851", "-udp-listen", "0.0.0.0:8446"]
    # The other way to give the node its ports: share the host's network. Remove the
    # whole "ports:" section above and uncomment the next line. Rules can then listen
    # on any free port of the host, and nothing has to be mapped; in exchange the
    # container is no longer separated from the host's network. The image opens the
    # web interface on every address of the host then; on a host that also faces
    # another network (a router, a gateway), uncomment the command line as well and
    # name the address the web interface should listen on.
    # network_mode: host
    # command: ["run", "-data", "/data", "-api", "127.0.0.1:9850", "-listen", "0.0.0.0:9851"]
    # (With the host's network, UDP feedback needs no mapping: add "-udp-listen",
    # "0.0.0.0:8446" to this command line.)
