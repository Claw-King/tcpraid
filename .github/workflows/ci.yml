# Every push to main or to a branch "ci/...", and every pull request: go vet and
# go test on Linux, macOS and Windows (with the race detector on the first two; gofmt
# once, on Linux).
# A tag "vX.Y.Z": also the release binaries (Linux, macOS, Windows) with their SHA-256
# file, attached to a release of that tag, and the container image for linux/amd64 and
# linux/arm64, pushed to the GitHub container registry as
# ghcr.io/<owner>/<repository>:X.Y.Z and :latest.
name: ci

on:
  push:
    branches: [main, "ci/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        if: matrix.os != 'windows-latest'
        run: go test -race -count=1 ./...
      # the race detector needs a C compiler, which the Windows machines may lack
      - name: go test (Windows, without the race detector)
        if: matrix.os == 'windows-latest'
        run: go test -count=1 ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: version and image name
        id: names
        # the tag without its "v"; a registry wants the image name in lower case
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"
      - name: binaries
        run: deploy/build.sh "${{ steps.names.outputs.version }}" dist
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.names.outputs.version }}
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.image }}:latest
